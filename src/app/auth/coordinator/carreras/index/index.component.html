<div class="container">
  @if (carreras$ | async; as carrerasInfo) {

    <div class="container mt-5">
      <div class="row g-4">
        @for (carrera of carrerasInfo.data; track $index) {
          <div class="col-12 col-sm-6 col-md-4">
            <div class="card shadow-sm h-100 d-flex flex-column">
              <div class="card-body">
                <h5 class="card-title text-primary">{{ carrera.name | titlecase }}</h5>
                <h6 class="card-subtitle mb-3 text-muted">Cargas Académicas {{ carrera.academic_loads.length }}</h6>
              </div>
              <div class="card-footer d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a (click)="openModalAcademico(carrera)" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-eye me-1"></i>Ver Cargas
                  </a>
                  <a class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-trash3 me-1"></i>Eliminar
                  </a>
                </div>
              </div>
            </div>
          </div>
        }
      </div>
    </div>


  }@else if (error) {
    <app-error-servidor></app-error-servidor>
  }@else {
    <ngx-spinner bdColor = "rgba(0, 0, 0, 0.8)" size = "medium" color = "#fff" type = "pacman" [fullScreen] = "true">
      <p style="color: white" > Cargando </p>
    </ngx-spinner>
  }

</div>
