<div class="container mt-4">
  <h2 class="text-center text-secondary">Horario De Clases</h2>
  <div class="table-responsive">
    <table class="table table-bordered schedule-table">
      <thead>
        <tr>
          <th>Hora</th>
          @for (dia of dias; track $index) {
            <th class="time-block">{{ dia | titlecase }}</th>
          }
        </tr>
      </thead>
      <tbody>
        @for (hora of horas;let i = $index; track $index) {
          <tr>
            <td class="text-hora">{{ hora }}</td>
            @for (dia of dias; track $index) {
              @if (horarioTransformado[dia][i]; as clase) {
                <td class="text-center align-content-center text-asignatura" [rowSpan]="clase.rowspan">{{ clase.name }}</td>
              }
            }
          </tr>
        }
      </tbody>
    </table>


  </div>
</div>
